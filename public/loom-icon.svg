<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="loom-grad-1" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B4F04A" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <linearGradient id="loom-grad-2" x1="42" y1="8" x2="6" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </linearGradient>
    <filter id="loom-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="48" height="48" rx="10" fill="#141518" stroke="#26282D" stroke-width="1.5" />

  <!-- Interwoven Warp and Weft Strands (Loom Motif) -->
  <!-- Vertical Weft Threads -->
  <line x1="16" y1="12" x2="16" y2="36" stroke="#26282D" stroke-width="2.5" stroke-linecap="round" />
  <line x1="24" y1="12" x2="24" y2="36" stroke="#3A3D44" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="12" x2="32" y2="36" stroke="#26282D" stroke-width="2.5" stroke-linecap="round" />

  <!-- Dynamic Warp Pulse Loop -->
  <path d="M12 28 C16 28, 16 18, 24 18 C32 18, 32 28, 36 28" 
        stroke="url(#loom-grad-1)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#loom-glow)" />

  <!-- Counter-strand weaving through -->
  <path d="M12 20 C16 20, 16 30, 24 30 C32 30, 32 20, 36 20" 
        stroke="url(#loom-grad-2)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Warp Connection Nodes -->
  <circle cx="24" cy="18" r="2.5" fill="#B4F04A" />
  <circle cx="24" cy="30" r="2.5" fill="#A3E635" />
</svg>
