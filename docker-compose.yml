services:
  loom:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: loom-loadtest-server
    restart: unless-stopped
    volumes:
      - ./data:/opt/loom/data           # SQLite database persistence
      - ./examples:/opt/loom/examples   # Shared test scripts
      - ./runs:/opt/loom/runs           # Run artifact logs & CSVs
      - ./engines:/opt/loom/engines:ro  # Optional BYO k6 binary (k6 / k6.exe)
    environment:
      - LOOM_ENV=production
      - LOOM_DATA_DIR=/opt/loom/data
      - LOOM_RUNS_DIR=/opt/loom/runs
    networks:
      - loom-network

networks:
  loom-network:
    driver: bridge
