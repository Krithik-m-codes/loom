[package]
name = "loom"
version = "0.2.0"
edition = "2021"
description = "Multi-engine load testing desktop app"

[lib]
name = "loom_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
engine-core = { path = "../crates/engine-core" }
engine-locust = { path = "../crates/engine-locust" }
engine-goose = { path = "../crates/engine-goose" }
engine-k6 = { path = "../crates/engine-k6" }
runtime-manager = { path = "../crates/runtime-manager" }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"

[dev-dependencies]
tempfile = "3"
